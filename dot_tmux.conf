set -s escape-time 10

set -g mode-keys vi
set -g prefix C-f
set -g prefix2 C-b

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -R -10
bind -r J resize-pane -D 5
bind -r K resize-pane -D -5
bind -r L resize-pane -R 10

bind -T move -r h move-pane -L 10
bind -T move -r j move-pane -D 5
bind -T move -r k move-pane -U 5
bind -T move -r l move-pane -R 10

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind t switch-client -T tool
bind -T tool y display-popup -x C -y C -h 90% -w 90% -E -d '#{pane_current_path}' \
  'tmux new-session yazi \; set status off'
bind -T tool g display-popup -x C -y C -h 90% -w 90% -E -d '#{pane_current_path}' \
  'tmux new-session lazygit \; set status off'
bind -T tool e capture-pane -J -S - \; \
  save-buffer /tmp/tmux-buffer.txt \; \
  display-popup -x C -y C -h 90% -w 90% -E "$EDITOR + /tmp/tmux-buffer.txt"

# Options to make tmux more pleasant
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# for shift-space
set -s extended-keys on

# set status line style to default
set -g window-status-current-style default

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
# basic, slanted, rounded, custom
set -g @catppuccin_window_status_style "basic"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g @catppuccin_status_connect_separator "yes"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
#set -g @catppuccin_status_left_separator ""
#set -g @catppuccin_status_right_separator ""

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
# For TPM, instead use `run ~/.tmux/plugins/tmux/catppuccin.tmux`

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ga status-right "#{E:@catppuccin_status_session}"

# for tmux 3.7+
set -ga message-command-style reverse,fill=#1e1e2e,align=left
set -ga message-style fill=#1e1e2e,align=left

# for transparent background
set -ga popup-style "bg=terminal"
